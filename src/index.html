<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TimeClock</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@300;400;500;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #111214;
    --ink-2: #555860;
    --ink-3: #9a9ea6;
    --rule: #e2e4e8;
    --bg: #f7f8fa;
    --white: #ffffff;
    --green: #16a34a;
    --green-bg: #dcfce7;
    --red: #dc2626;
    --red-bg: #fee2e2;
    --amber: #d97706;
    --amber-bg: #fef3c7;
    --punch: #0f172a;
    --blue: #2563eb;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  nav {
    background: var(--punch);
    padding: 0 24px;
    display: flex;
    align-items: center;
    height: 52px;
    position: sticky; top: 0; z-index: 100;
  }
  .logo { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 15px; color: #fff; letter-spacing: 0.04em; }
  .logo span { color: #38bdf8; }

  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px 20px; }

  .card {
    background: var(--white);
    border: 1px solid var(--rule);
    border-radius: 16px;
    padding: 32px 28px;
    width: 100%; max-width: 380px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.06);
  }

  .card-title { font-size: 18px; font-weight: 600; margin-bottom: 2px; }
  .live-clock { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-3); margin-bottom: 24px; }

  /* ── PIN display ── */
  .pin-display {
    display: flex; gap: 8px; justify-content: center;
    margin-bottom: 20px;
  }
  .pin-dot {
    width: 14px; height: 14px;
    border-radius: 50%;
    border: 2px solid var(--rule);
    background: var(--bg);
    transition: background 0.15s, border-color 0.15s;
  }
  .pin-dot.filled { background: var(--punch); border-color: var(--punch); }
  .pin-dot.error  { background: var(--red);   border-color: var(--red); }
  .pin-dot.ok     { background: var(--green); border-color: var(--green); }

  /* ── Keypad ── */
  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
  .key {
    aspect-ratio: 1;
    border: 1px solid var(--rule);
    border-radius: 10px;
    background: var(--white);
    font-size: 20px;
    font-weight: 500;
    font-family: 'IBM Plex Mono', monospace;
    color: var(--ink);
    cursor: pointer;
    transition: background 0.1s, transform 0.08s;
    display: flex; align-items: center; justify-content: center;
  }
  .key:hover  { background: var(--bg); }
  .key:active { transform: scale(0.93); background: var(--rule); }
  .key.del    { font-size: 15px; color: var(--ink-2); }
  .key.zero   { grid-column: 2; }

  /* ── Action buttons ── */
  .btn-row { display: flex; gap: 10px; }
  .btn {
    flex: 1; border: none; border-radius: 10px;
    padding: 13px; font-size: 14px; font-weight: 600;
    font-family: 'Inter', sans-serif;
    cursor: pointer; transition: opacity 0.15s, transform 0.1s;
  }
  .btn:hover:not(:disabled)  { opacity: 0.88; }
  .btn:active:not(:disabled) { transform: scale(0.97); }
  .btn:disabled { opacity: 0.32; cursor: not-allowed; }
  .btn-in  { background: var(--green); color: #fff; }
  .btn-out { background: var(--red);   color: #fff; }

  /* ── Confirm screen ── */
  .confirm { display: none; text-align: center; padding: 8px 0; }
  .confirm.active { display: block; }
  .confirm-name { font-size: 22px; font-weight: 600; margin-bottom: 8px; }
  .confirm-sub  { font-size: 13px; color: var(--ink-2); margin-bottom: 18px; }
  .confirm .btn-row { margin-bottom: 12px; }
  .btn-cancel { width: 100%; background: none; border: 1px solid var(--rule); border-radius: 10px; padding: 10px; font-size: 13px; font-family: 'Inter', sans-serif; color: var(--ink-2); cursor: pointer; }
  .btn-cancel:hover { background: var(--bg); }

  /* ── Clock status badge ── */
  .clock-status-badge {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 6px 14px; border-radius: 999px;
    font-size: 12px; font-weight: 600; letter-spacing: 0.03em;
    font-family: 'IBM Plex Mono', monospace;
    margin-bottom: 18px;
  }
  .clock-status-badge .dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  }
  .badge-in  { background: var(--green-bg); color: var(--green); border: 1px solid #bbf7d0; }
  .badge-in .dot  { background: var(--green); }
  .badge-out { background: var(--red-bg); color: var(--red); border: 1px solid #fecaca; }
  .badge-out .dot { background: var(--red); }
  .badge-none { background: var(--bg); color: var(--ink-3); border: 1px solid var(--rule); }
  .badge-none .dot { background: var(--ink-3); }

  /* ── Status ── */
  .status {
    margin-top: 16px; padding: 11px 14px;
    border-radius: 8px; font-size: 12px;
    font-family: 'IBM Plex Mono', monospace;
    min-height: 40px; line-height: 1.5;
    background: var(--bg); border: 1px solid var(--rule); color: var(--ink-3);
    white-space: pre-wrap;
  }
  .status.ok     { background: var(--green-bg); color: var(--green); border-color: #bbf7d0; }
  .status.err    { background: var(--red-bg);   color: var(--red);   border-color: #fecaca; }
  .status.loading { color: var(--ink-3); }

  .spinner { display: inline-block; width: 11px; height: 11px; border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: middle; margin-right: 5px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  footer { text-align: center; padding: 14px; font-size: 11px; color: var(--ink-3); }
</style>
</head>
<body>

<nav><div class="logo">TIME<span>CLOCK</span></div></nav>

<main>
  <div class="card">
    <div class="card-title">Clock In / Out</div>
    <div class="live-clock" id="live-clock"></div>

    <!-- PIN entry screen -->
    <div id="screen-pin">
      <div class="pin-display" id="pin-display">
        <div class="pin-dot" id="d0"></div>
        <div class="pin-dot" id="d1"></div>
        <div class="pin-dot" id="d2"></div>
        <div class="pin-dot" id="d3"></div>
        <div class="pin-dot" id="d4"></div>
        <div class="pin-dot" id="d5"></div>
      </div>

      <div class="keypad">
        <button class="key" onclick="keyPress('1')">1</button>
        <button class="key" onclick="keyPress('2')">2</button>
        <button class="key" onclick="keyPress('3')">3</button>
        <button class="key" onclick="keyPress('4')">4</button>
        <button class="key" onclick="keyPress('5')">5</button>
        <button class="key" onclick="keyPress('6')">6</button>
        <button class="key" onclick="keyPress('7')">7</button>
        <button class="key" onclick="keyPress('8')">8</button>
        <button class="key" onclick="keyPress('9')">9</button>
        <button class="key del" onclick="keyDel()">&#x232B;</button>
        <button class="key zero" onclick="keyPress('0')">0</button>
      </div>
    </div>

    <!-- Confirm screen -->
    <div class="confirm" id="screen-confirm">
      <div class="confirm-name" id="confirm-name"></div>
      <div id="clock-status-badge" class="clock-status-badge badge-none">
        <span class="dot"></span>
        <span id="clock-status-text">No punches today</span>
      </div>
      <div class="confirm-sub">Choose an action below</div>
      <div class="btn-row">
        <button class="btn btn-in"  onclick="punch('in')">Clock In</button>
        <button class="btn btn-out" onclick="punch('out')">Clock Out</button>
      </div>
      <button class="btn-cancel" onclick="resetToPin()">&#x2190; Back</button>
    </div>

    <div class="status loading" id="status">Enter your 6-digit PIN.</div>
  </div>
</main>

<footer>Records sync in real time.</footer>

<script>
  // ── Supabase config ─────────────────────────────────────────
  const SUPABASE_URL = 'https://iifkbqjxolndaehkyasc.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlpZmticWp4b2xuZGFlaGt5YXNjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1ODcyNTEsImV4cCI6MjEwNTE2MzI1MX0.SXhBVlV4l7q4TAdoOQPW1wb1dKUmp-IZ30ZHnIjkzhc';
  const API = SUPABASE_URL + '/rest/v1';
  const HEADERS = {
    'apikey': SUPABASE_KEY,
    'Content-Type': 'application/json',
    'Prefer': 'return=representation'
  };

  let pin = '';
  let verifiedName = '';
  let verifiedBranch = '';
  let verifiedEmployeeId = null;
  let verifiedBranchId = null;
  let busy = false;
  let LOCATIONS = [];

  // ── Supabase REST helper ────────────────────────────────────
  // Provides detailed errors so browser/network, HTTP, and Supabase
  // permission/query failures are distinguishable.
  async function sb(method, path, body) {
    const url = API + path;
    const opts = {
      method,
      headers: HEADERS,
      mode: 'cors',
      cache: 'no-store'
    };

    if (body !== undefined && body !== null) {
      opts.body = JSON.stringify(body);
    }

    let res;
    let raw = '';

    try {
      res = await fetch(url, opts);
      raw = await res.text();
    } catch (err) {
      const detail = err && err.message ? err.message : String(err);
      throw new Error(
        'Network request failed. ' +
        'Could not reach Supabase at ' + SUPABASE_URL +
        '. Browser error: ' + detail +
        '. Check your internet connection, Supabase URL, CORS, and browser console.'
      );
    }

    if (!res.ok) {
      let detail = raw;
      try {
        const parsed = raw ? JSON.parse(raw) : {};
        detail = parsed.message || parsed.msg || parsed.error_description ||
                 parsed.error || raw;
      } catch (_) {}

      throw new Error(
        'Supabase API error ' + res.status + ' ' + res.statusText +
        (detail ? ': ' + detail : '')
      );
    }

    if (!raw) return null;

    try {
      return JSON.parse(raw);
    } catch (err) {
      throw new Error(
        'Supabase returned invalid JSON (HTTP ' + res.status + '): ' +
        raw.slice(0, 300)
      );
    }
  }

  // ── Load geofence locations on page load ────────────────────
  async function loadLocations() {
    try {
      const rows = await sb('GET', '/branches?select=name,latitude,longitude,radius');
      LOCATIONS = (rows || []).filter(r => r.latitude && r.longitude).map(r => ({
        name: r.name, lat: r.latitude, lng: r.longitude, radius: r.radius || 200
      }));
    } catch(e) {
      console.error('Could not load locations:', e);
      setStatus('err', 'Could not load branch locations: ' + (e.message || String(e)));
    }
  }
  loadLocations();

  // ── Live clock ──────────────────────────────────────────────
  function tick() {
    const now = new Date();
    document.getElementById('live-clock').textContent =
      now.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric', year:'numeric' }) +
      '  ·  ' + now.toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
  }
  setInterval(tick, 1000); tick();

  // ── Geofence ────────────────────────────────────────────────
  function getDistanceMeters(lat1, lng1, lat2, lng2) {
    const R = 6371000;
    const p1 = lat1 * Math.PI / 180, p2 = lat2 * Math.PI / 180;
    const dp = (lat2 - lat1) * Math.PI / 180, dl = (lng2 - lng1) * Math.PI / 180;
    const a = Math.sin(dp/2)**2 + Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  function checkGeofence(branchName) {
    const loc = LOCATIONS.find(l => l.name === branchName);
    if (!loc) return Promise.resolve(null);
    return new Promise(resolve => {
      if (!navigator.geolocation) { resolve('Location not supported.'); return; }
      navigator.geolocation.getCurrentPosition(
        pos => {
          const d = getDistanceMeters(pos.coords.latitude, pos.coords.longitude, loc.lat, loc.lng);
          resolve(d <= loc.radius ? null : 'You must be at ' + branchName + '. (' + Math.round(d) + 'm away)');
        },
        err => {
          const m = {1:'Location denied.',2:'Location unavailable.',3:'Location timed out.'};
          resolve(m[err.code] || 'Location error.');
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    });
  }

  // ── Keypad ──────────────────────────────────────────────────
  function keyPress(digit) {
    if (busy || pin.length >= 6) return;
    pin += digit;
    updateDots();
    if (pin.length === 6) setTimeout(submitPin, 120);
  }

  function keyDel() {
    if (busy) return;
    pin = pin.slice(0, -1);
    updateDots();
    setStatus('', 'Enter your 6-digit PIN.');
  }

  function updateDots(state) {
    for (let i = 0; i < 6; i++) {
      const dot = document.getElementById('d' + i);
      dot.className = 'pin-dot';
      if (state) dot.classList.add(state);
      else if (i < pin.length) dot.classList.add('filled');
    }
  }

  document.addEventListener('keydown', e => {
    if (e.key >= '0' && e.key <= '9') keyPress(e.key);
    else if (e.key === 'Backspace') keyDel();
  });

  // ── Submit PIN ──────────────────────────────────────────────
  async function submitPin() {
    busy = true;
    setStatus('loading', '<span class="spinner"></span> Verifying...');

    try {
      // Query employees table using the current employees schema.
      // Columns: id, first_name, last_name, branch_id, remote, pin, email
      // Branch name is read through the existing branches relationship.
      const rows = await sb('GET',
        '/employees?select=id,first_name,last_name,branch_id,remote,pin,email,branches(name)&pin=eq.' + encodeURIComponent(pin)
      );

      if (rows && rows.length > 0) {
        const emp = rows[0];
        verifiedName       = [emp.first_name, emp.last_name].filter(Boolean).join(' ');
        verifiedEmployeeId = emp.id;
        verifiedBranchId   = emp.branch_id;
        verifiedBranch     = emp.branches ? emp.branches.name : '';

        updateDots('ok');
        setStatus('ok', 'PIN accepted — ' + verifiedName);
        setTimeout(() => {
          document.getElementById('screen-pin').style.display = 'none';
          document.getElementById('confirm-name').textContent = verifiedName;
          document.getElementById('screen-confirm').classList.add('active');
          setClockBadge(null, null); // grey initially
          setStatus('', 'Clock in or out below.');

          // Load status in background
          loadClockStatus();
        }, 400);
      } else {
        updateDots('error');
        setStatus('err', 'PIN not recognised.');
        setTimeout(() => { pin = ''; busy = false; updateDots(); setStatus('', 'Enter your 6-digit PIN.'); }, 1200);
      }
    } catch (err) {
      console.error('PIN verification failed:', err);
      updateDots('error');
      setStatus('err', 'Supabase error: ' + (err.message || String(err)));
      setTimeout(() => {
        pin = '';
        busy = false;
        updateDots();
        setStatus('', 'Enter your 6-digit PIN.');
      }, 5000);
    }
  }

  // ── Load clock status (background) ──────────────────────────
  async function loadClockStatus() {
    try {
      const today = new Date()
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0'); // Months are 0-based
      const day = String(now.getDate()).padStart(2, '0');
      const dateStr = `${year}-${month}-${day}`;  // Matches user's local date
      
      const rows = await sb('GET',
        '/punches?employee_id=eq.' + verifiedEmployeeId +
        '&date=eq.' + dateStr +
        '&order=id.desc&limit=1'
      );
      if (rows && rows.length > 0) {
        const p = rows[0];
        if (p.clock_in && !p.clock_out) {
          setClockBadge('IN', p.clock_in);
        } else if (p.clock_in && p.clock_out) {
          setClockBadge('OUT', p.clock_out);
        }
      }
    } catch(e) {
      console.error('Could not load clock status:', e);
      // Badge stays grey, but the exact API error is available in DevTools.
    }
  }

  // ── Format time for display ─────────────────────────────────
  function fmtTime(timeStr) {
    if (!timeStr) return '';
    // timeStr is "HH:MM:SS" from Postgres — convert to 12hr
    const parts = timeStr.split(':');
    let h = parseInt(parts[0]), m = parts[1], s = parts[2];
    const ap = h >= 12 ? 'PM' : 'AM';
    if (h > 12) h -= 12;
    if (h === 0) h = 12;
    return String(h).padStart(2,'0') + ':' + m + ':' + s + ' ' + ap;
  }

  // ── Punch ───────────────────────────────────────────────────
  async function punch(type) {
    busy = true;

    // Geofence check
    setStatus('loading', '<span class="spinner"></span> Checking location...');
    const geoError = await checkGeofence(verifiedBranch);
    if (geoError) {
      setStatus('err', geoError);
      busy = false;
      return;
    }

    // Capture time on employee's phone
    const now = new Date();
    // 1. Get user local YYYY-MM-DD
    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, '0'); // Months are 0-based
    const day = String(now.getDate()).padStart(2, '0');
    const dateStr = `${year}-${month}-${day}`;  // Matches user's local date

    // 2. Get user local HH:MM:SS (24-hour format)
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    const seconds = String(now.getSeconds()).padStart(2, '0');
    const timeStr = `${hours}:${minutes}:${seconds}`; // Matches user's local time

    // 3. User display formats (These naturally use the device's timezone)
    const displayTime = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    const displayDate = now.toLocaleDateString('en-US');
    try {
      if (type === 'in') {
        // Check for existing open punch today
        const existing = await sb('GET',
          '/punches?employee_id=eq.' + verifiedEmployeeId +
          '&date=eq.' + dateStr +
          '&clock_out=is.null&limit=1'
        );
        if (existing && existing.length > 0) {
          setStatus('err', verifiedName + ' is already clocked in today.');
          busy = false;
          return;
        }

        // Show instant confirmation
        setStatus('ok', 'Clocked IN — ' + verifiedName + '\n' + displayDate + ' at ' + displayTime);
        setTimeout(resetToPin, 2200);

        // Insert in background
        await sb('POST', '/punches', {
          employee_id: verifiedEmployeeId,
          date: dateStr,
          clock_in: timeStr,
          notes: ''
        });

      } else {
        // Find open punch to close
        const open = await sb('GET',
          '/punches?employee_id=eq.' + verifiedEmployeeId +
          '&date=eq.' + dateStr +
          '&clock_out=is.null&order=id.desc&limit=1'
        );

        if (!open || open.length === 0) {
          // Check if already clocked out
          const last = await sb('GET',
            '/punches?employee_id=eq.' + verifiedEmployeeId +
            '&date=eq.' + dateStr +
            '&order=id.desc&limit=1'
          );
          if (last && last.length > 0 && last[0].clock_out) {
            setStatus('err', verifiedName + ' has already clocked out today.');
          } else {
            setStatus('err', verifiedName + ' has not clocked in yet today.');
          }
          busy = false;
          return;
        }

        // Show instant confirmation
        setStatus('ok', 'Clocked OUT — ' + verifiedName + '\n' + displayDate + ' at ' + displayTime);
        setTimeout(resetToPin, 2200);

        // Update in background
        await sb('PATCH',
          '/punches?id=eq.' + open[0].id,
          { clock_out: timeStr }
        );
      }
    } catch (err) {
      if (err.message && err.message.includes('duplicate')) {
        setStatus('err', verifiedName + ' is already clocked in today.');
      } else {
        setStatus('err', 'Error: ' + err.message);
      }
      busy = false;
    }
  }

  // ── Reset ───────────────────────────────────────────────────
  function resetToPin() {
    pin = ''; busy = false; verifiedName = ''; verifiedBranch = '';
    verifiedEmployeeId = null; verifiedBranchId = null;
    document.getElementById('screen-pin').style.display = '';
    document.getElementById('screen-confirm').classList.remove('active');
    updateDots();
    setStatus('', 'Enter your 6-digit PIN.');
  }

  // ── Helpers ─────────────────────────────────────────────────
  function setStatus(cls, html) {
    const el = document.getElementById('status');
    el.className = 'status' + (cls ? ' ' + cls : '');
    el.innerHTML = html;
  }

  function setClockBadge(status, time) {
    const badge = document.getElementById('clock-status-badge');
    const text  = document.getElementById('clock-status-text');
    badge.className = 'clock-status-badge';
    if (status === 'IN') {
      badge.classList.add('badge-in');
      text.textContent = 'Clocked in' + (time ? ' at ' + fmtTime(time) : '');
    } else if (status === 'OUT') {
      badge.classList.add('badge-out');
      text.textContent = 'Clocked out' + (time ? ' at ' + fmtTime(time) : '');
    } else {
      badge.classList.add('badge-none');
      text.textContent = 'No punches today';
    }
  }
</script>
</body>
</html>
